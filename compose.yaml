
services:
  db:
    image: postgres:17
    container_name: secureapi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: secureapi
      POSTGRES_USER: secureapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secureapi_dev_password}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureapi -d secureapi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
